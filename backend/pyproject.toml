[project]
name = "content-intelligence-engine"
version = "0.1.0"
description = "Researches a topic, organizes traceable sources and turns verifiable information into content scripts."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142,<1.0",
    "uvicorn>=0.54,<1.0",
    "pydantic>=2.13,<3.0",
    "pydantic-settings>=2.15,<3.0",
    "sqlalchemy>=2.1,<3.0",
    "psycopg[binary]>=3.3,<4.0",
    "alembic>=1.20,<2.0",
    "feedparser>=6.0.14,<7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.16,<1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
